[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-spam-course-project"
version = "1.0.0"
description = "SMS spam text classification experiments for COMP-671"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2", "torch>=2.0", "matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]
